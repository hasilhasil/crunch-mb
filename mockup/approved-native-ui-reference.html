        </div>

      <button type="button" class="cmb-linked-trigger" data-action="linked" aria-label="四段联动控制" aria-expanded="false"><i data-lucide="link-2" aria-hidden="true"></i><span>LINKED CONTROL</span><span class="cmb-trigger-note">四段联动</span><span>⌃</span></button>
    </div>
    <footer class="cmb-bottom"><label class="cmb-phase"><span>PHASE</span><select aria-label="相位模式"><option>Natural Phase</option><option>Minimal Phase</option><option>Linear Phase</option></select></label><label><span>SLOPE</span><select aria-label="分频斜率"><option>24 dB/oct</option><option>12 dB/oct</option><option>36 dB/oct</option><option>48 dB/oct</option></select></label><label><span>QUALITY</span><select aria-label="线性相位质量"><option>Medium</option><option>Low</option><option>High</option></select></label><label><span>LOOKAHEAD</span><select aria-label="全局前瞻"><option>Off</option><option>1 ms</option><option>3 ms</option></select></label><label><span>OVERSAMPLING</span><select aria-label="过采样"><option>Off</option><option>2×</option><option>4×</option></select></label><button type="button" data-action="analyzer" class="cmb-bottom-button" aria-expanded="false"><i data-lucide="audio-lines" aria-hidden="true"></i><span>Analyzer</span></button><button type="button" data-action="output" class="cmb-bottom-button" aria-expanded="false"><span>OUT</span><strong>0.0 dB</strong></button><button type="button" class="cmb-bypass" aria-pressed="false">BYPASS</button></footer>
    <button type="button" class="cmb-resize-grip" aria-label="调整界面尺寸：左右方向键改变宽度，上下方向键改变高度"><span aria-hidden="true">◢</span></button>
    <span class="cmb-announcer" aria-live="polite"></span>
  </div>
    </section>
</div>
